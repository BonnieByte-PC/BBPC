<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrispyKP C&C Stats Overlay</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:transparent;
font-family:Segoe UI,Arial,sans-serif;
color:white;
overflow:hidden;
}

.overlay{
display:flex;
align-items:center;
background:#121212;
border:2px solid #1f1f1f;
width:1100px;
height:90px;
box-shadow:0 0 20px rgba(0,0,0,.7);
}

.section{
padding:10px 16px;
border-right:1px solid #242424;
display:flex;
flex-direction:column;
justify-content:center;
height:100%;
}

.section:last-child{
border-right:none;
}

.stats{
width:260px;
}

.rank{
width:160px;
text-align:center;
}

.match{
width:300px;
}

.logo{
width:160px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:20px;
color:#4fd2ff;
text-shadow:0 0 8px rgba(79,210,255,.25);
}

.label{
color:#9a9a9a;
font-size:12px;
}

.value{
font-weight:bold;
font-size:16px;
}

.result-win{
color:#4fd2ff;
font-weight:bold;
}

.result-loss{
color:#ff5a5a;
font-weight:bold;
}

.ranknum{
font-size:28px;
color:#4fd2ff;
font-weight:bold;
line-height:1;
}

.error{
color:#ff5a5a;
font-size:12px;
margin-top:4px;
}
</style>
</head>
<body>

<div class="overlay">

  <div class="section stats">
    <div>Wins: <span id="wins">--</span></div>
    <div>Losses: <span id="losses">--</span></div>
    <div>Ratio: <span id="ratio">--</span></div>
    <div id="statsError" class="error"></div>
  </div>

  <div class="section logo">
    KrispyKP
  </div>

  <div class="section rank">
    <div class="ranknum" id="rank">--</div>
    <div class="label">Rank</div>
    <div class="label">Points</div>
    <div class="value" id="points">--</div>
  </div>

  <div class="section match">
    <div class="label">Last Match</div>
    <div>Opponent: <span id="opponent">--</span></div>
    <div>Map: <span id="map">--</span></div>
    <div>Result: <span id="result">--</span></div>
    <div id="matchError" class="error"></div>
  </div>

</div>

<script>
const playerAPI = "https://cncstatsapi.azurewebsites.net/api/Player/76561198056653731?season=23&game=TD";
const matchesAPI = "https://cncstatsapi.azurewebsites.net/api/Player/76561198056653731/Matches?season=23&game=TD";

const winsEl = document.getElementById("wins");
const lossesEl = document.getElementById("losses");
const ratioEl = document.getElementById("ratio");
const rankEl = document.getElementById("rank");
const pointsEl = document.getElementById("points");
const opponentEl = document.getElementById("opponent");
const mapEl = document.getElementById("map");
const resultEl = document.getElementById("result");
const statsErrorEl = document.getElementById("statsError");
const matchErrorEl = document.getElementById("matchError");

async function fetchJson(url){
  const response = await fetch(`${url}&t=${Date.now()}`, {
    cache: "no-store"
  });

  if(!response.ok){
    throw new Error(`HTTP ${response.status}`);
  }

  return await response.json();
}

async function loadPlayer(){
  try{
    statsErrorEl.textContent = "";

    const data = await fetchJson(playerAPI);
    const position = data.position;

    if(!position){
      throw new Error("Missing position data");
    }

    const wins = Number(position.wins ?? 0);
    const losses = Number(position.losses ?? 0);
    const points = Number(position.points ?? 0);
    const rank = position.rank ?? "--";

    let ratio = "0%";
    if(typeof position.winPercentage === "number"){
      ratio = Math.round(position.winPercentage) + "%";
    }else if((wins + losses) > 0){
      ratio = Math.round((wins / (wins + losses)) * 100) + "%";
    }

    winsEl.textContent = wins;
    lossesEl.textContent = losses;
    ratioEl.textContent = ratio;
    rankEl.textContent = "#" + rank;
    pointsEl.textContent = points.toFixed(0);
  }catch(error){
    console.error("Player API error:", error);
    statsErrorEl.textContent = "Stats unavailable";
  }
}

async function loadMatch(){
  try{
    matchErrorEl.textContent = "";

    const data = await fetchJson(matchesAPI);

    if(!Array.isArray(data) || data.length === 0){
      throw new Error("No matches found");
    }

    const match = data[0];

    opponentEl.textContent = match.opponentName ?? "--";
    mapEl.textContent = match.mapName ?? "--";

    if(match.win === true){
      resultEl.textContent = "WIN";
      resultEl.className = "result-win";
    }else if(match.win === false){
      resultEl.textContent = "LOSS";
      resultEl.className = "result-loss";
    }else{
      resultEl.textContent = "--";
      resultEl.className = "";
    }
  }catch(error){
    console.error("Match API error:", error);
    matchErrorEl.textContent = "Match unavailable";
  }
}

async function update(){
  await Promise.all([
    loadPlayer(),
    loadMatch()
  ]);
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
